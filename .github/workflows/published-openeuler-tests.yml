name: Published openEuler container tests
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: published-openeuler-tests
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [docker, containerd, podman]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archive importer and SSH client
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends skopeo sshpass
      - name: Verify published archive and native container startup, SSH, network and restart
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_ARCH: ${{ matrix.platform.arch }}
        run: python3 .github/scripts/verify_published_openeuler.py
