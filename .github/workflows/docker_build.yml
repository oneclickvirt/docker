name: Build Docker Images and Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: spiritlhl
  GHCR_IMAGE: ghcr.io/oneclickvirt/docker
jobs:
  script-regression:
    name: IPv6 network script regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify IPv6 subnet allocation safeguards
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends shellcheck
        bash -n scripts/dockerinstall.sh
        shellcheck tests/test_ipv6_network.sh
        bash tests/test_ipv6_network.sh
        bash tests/password_persistence_test.sh
        bash tests/host_ipv6_preservation_test.sh
        bash tests/cron_content_test.sh
  build-and-push:
    needs: script-regression
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: docker-build-${{ github.ref }}-${{ matrix.tag_suffix }}-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - dockerfile: Dockerfile_alpine
          tag_suffix: alpine
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_alpine
          tag_suffix: alpine
          arch: arm64
          runner: ubuntu-24.04-arm
        - dockerfile: Dockerfile_ubuntu
          tag_suffix: ubuntu
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_ubuntu
          tag_suffix: ubuntu
          arch: arm64
          runner: ubuntu-24.04-arm
        - dockerfile: Dockerfile_debian
          tag_suffix: debian
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_debian
          tag_suffix: debian
          arch: arm64
          runner: ubuntu-24.04-arm
        - dockerfile: Dockerfile_almalinux
          tag_suffix: almalinux
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_almalinux
          tag_suffix: almalinux
          arch: arm64
          runner: ubuntu-24.04-arm
        - dockerfile: Dockerfile_rockylinux
          tag_suffix: rockylinux
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_rockylinux
          tag_suffix: rockylinux
          arch: arm64
          runner: ubuntu-24.04-arm
        - dockerfile: Dockerfile_openeuler
          tag_suffix: openeuler
          arch: amd64
          runner: ubuntu-latest
        - dockerfile: Dockerfile_openeuler
          tag_suffix: openeuler
          arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker image
      run: |
        docker build \
          -f dockerfiles/${{ matrix.dockerfile }} \
          -t ${{ env.IMAGE_NAME }}:${{ matrix.tag_suffix }}-${{ matrix.arch }} \
          --platform linux/${{ matrix.arch }} \
          .
    - name: Push arch-specific image to GHCR
      run: |
        docker tag \
          ${{ env.IMAGE_NAME }}:${{ matrix.tag_suffix }}-${{ matrix.arch }} \
          ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }}-${{ matrix.arch }}
        docker push ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }}-${{ matrix.arch }}
    - name: Save Docker image as tar
      run: |
        FILENAME=${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_${{ matrix.arch }}.tar.gz
        docker save ${{ env.IMAGE_NAME }}:${{ matrix.tag_suffix }}-${{ matrix.arch }} | gzip > "$FILENAME"
        ls -lh -- ./*.tar.gz
    - name: Upload artifact for release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_${{ matrix.arch }}
        path: ${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_${{ matrix.arch }}.tar.gz
        retention-days: 1
  create-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-manifest-${{ github.ref }}-${{ matrix.tag_suffix }}
      cancel-in-progress: false
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tag_suffix:
        - alpine
        - ubuntu
        - debian
        - almalinux
        - rockylinux
        - openeuler
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create and push multi-arch manifest to GHCR
      run: |
        docker manifest create \
          ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }} \
          ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }}-amd64 \
          ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }}-arm64
        docker manifest push ${{ env.GHCR_IMAGE }}:${{ matrix.tag_suffix }}
  create-releases:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: docker-release-${{ github.ref }}-${{ matrix.tag_suffix }}
      cancel-in-progress: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag_suffix:
        - alpine
        - ubuntu
        - debian
        - almalinux
        - rockylinux
        - openeuler
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/docker/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download all artifacts for this OS
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_*
        merge-multiple: true
    - name: Create GitHub Release and upload assets
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        TAG=${{ matrix.tag_suffix }}
        AMD64_FILE=${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_amd64.tar.gz
        ARM64_FILE=${{ env.IMAGE_NAME }}_${{ matrix.tag_suffix }}_arm64.tar.gz

        if ! gh release view "$TAG" >/dev/null 2>&1; then
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          # shellcheck disable=SC2016 # Markdown backticks and printf placeholders are literal.
          RELEASE_NOTES=$(printf 'Docker images for %s system.\n\nAvailable architectures:\n- AMD64: `%s`\n- ARM64: `%s`\n\nGHCR images (multi-arch):\n```\ndocker pull %s:%s\n```' \
            "$TAG" "$AMD64_FILE" "$ARM64_FILE" "${{ env.GHCR_IMAGE }}" "$TAG")
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$RELEASE_NOTES" \
            --prerelease=false \
            --draft=false
        fi

        EXISTING_FILES=$(gh release view "$TAG" --json assets --jq '.assets[].name')

        for FILE in "$AMD64_FILE" "$ARM64_FILE"; do
          if echo "$EXISTING_FILES" | grep -q "^$FILE$"; then
            echo "File $FILE already exists in release $TAG. Deleting it..."
            gh release delete-asset "$TAG" "$FILE" -y
            sleep 12
          fi
        done

        gh release upload "$TAG" "$AMD64_FILE" "$ARM64_FILE"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
      shell: bash
'on':
  schedule:
  - cron: 0 13 * * *
  workflow_dispatch: null
